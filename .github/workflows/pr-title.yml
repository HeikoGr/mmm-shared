name: PR title

on:
  pull_request:
    # edited: a renamed PR has to be checked again; synchronize: the required check has to
    # report on the current head commit.
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-title:
    name: PR title
    runs-on: ubuntu-latest

    steps:
      # A squash merge turns the PR title into the commit on develop. This repo has no commit
      # checker of its own, so the types are listed here - same list as scripts/check-commit-msg.js
      # in the modules.
      - name: Validate PR title
        uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            chore
            revert
