version: 2
updates:
  # Grouped minor/patch bumps: one PR and one CI run per day instead of one per package.
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: daily
    groups:
      actions:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: daily
    groups:
      npm:
        update-types: [minor, patch]
