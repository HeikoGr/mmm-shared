version: 2
updates:
  # Grouped minor/patch bumps: one PR and one CI run per day instead of one per package.
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: daily
    # A fresh release waits 3 days: a compromised or broken one is usually pulled by then.
    cooldown:
      default-days: 3
    groups:
      actions:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: daily
    # A fresh release waits 3 days: a compromised or broken one is usually pulled by then.
    cooldown:
      default-days: 3
    groups:
      npm:
        update-types: [minor, patch]
